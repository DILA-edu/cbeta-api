source titles%{v}
{
  type = xmlpipe2

  xmlpipe_command = cat /var/www/cbapi%{v}/shared/data/manticore-xml/titles.xml

  xmlpipe_field_string = content

  xmlpipe_attr_string = work
  xmlpipe_attr_string = canon
  xmlpipe_attr_string = canon_order

  # 2026-09 起 titles.xml 也帶朝代/部類/作譯者/年代，讓 /search/title 能限制搜尋範圍。
  # Manticore 用不到，但 xmlpipe2 的未宣告欄位會產生警告，所以一併宣告。
  xmlpipe_attr_string = category
  xmlpipe_attr_string = dynasty
  xmlpipe_attr_string = creators
  xmlpipe_attr_string = creators_with_id

  xmlpipe_attr_multi  = category_ids
  xmlpipe_attr_multi  = creator_id

  xmlpipe_attr_uint   = time_from
  xmlpipe_attr_uint   = time_to
}

table titles%{v}
{
  type = plain
  source = titles%{v}
  path = /var/lib/manticore/r%{v}-titles/r%{v}-titles
  charset_table = non_cjk
  ngram_len = 1
  ngram_chars = cjk, U+2580..U+25FF, U+2F00..U+A4CF, U+F900..U+FAFF, U+FE30..U+FE4F, U+20000..U+2FA1F
}
