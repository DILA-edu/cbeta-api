<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CBETA Tools API — Reference</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <!-- Scalar API Reference。spec 來源為同站的 /openapi.json。 -->
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        // 指向本站靜態提供的 OpenAPI 文件。
        // 用相對路徑(不加開頭斜線),才能同時相容於掛在路徑前綴下的
        // 部署(例如 https://cbdata.dila.edu.tw/dev/docs → /dev/openapi.json)
        // 與本機根目錄(http://127.0.0.1:3000/docs → /openapi.json)。
        url: 'openapi.json',
        // 深色/淺色由系統偏好決定
        theme: 'default',
      })
    </script>
  </body>
</html>
